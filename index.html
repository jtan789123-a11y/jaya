
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JK99 Promotion</title>

  <!-- META PIXEL -->
  <script>
    !function(f,b,e,v,n,t,s) {
      if(f.fbq)return;

      n=f.fbq=function() {
        n.callMethod
          ? n.callMethod.apply(n,arguments)
          : n.queue.push(arguments);
      };

      if(!f._fbq)f._fbq=n;

      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];

      t=b.createElement(e);
      t.async=!0;
      t.src=v;

      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);

    }(
      window,
      document,
      'script',
      'https://connect.facebook.net/en_US/fbevents.js'
    );

    // NEW META PIXEL ID
    fbq('init', '1964069838333443');

    // TRACK PAGE VIEW
    fbq('track', 'PageView');

  </script>
  <!-- END META PIXEL -->


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #003b22;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;
    }

    /* VIDEO CONTAINER */

    .video-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    /* CLICKABLE VIDEO */

    .video-link {
      display: block;

      max-width: 100%;
      max-height: 100%;

      cursor: pointer;
      text-decoration: none;

      line-height: 0;

      -webkit-tap-highlight-color: transparent;
    }

    /* VIDEO DISPLAY */

    .video-link video {
      display: block;

      width: auto;
      height: 100vh;
      height: 100dvh;

      max-width: 100vw;
      max-height: 100dvh;

      object-fit: contain;

      pointer-events: none;
    }

    /* MOBILE RESPONSIVE */

    @media (max-width: 768px) {

      .video-container {
        width: 100%;
        height: 100dvh;
      }

      .video-link video {
        max-width: 100vw;
        max-height: 100dvh;

        object-fit: contain;
      }

    }

    .video-link:focus-visible {
      outline: 3px solid #ffd700;
      outline-offset: -3px;
    }

  </style>

</head>


<body>

  <!-- META PIXEL NOSCRIPT -->

  <noscript>
    <img
      height="1"
      width="1"
      style="display:none"
      src="https://www.facebook.com/tr?id=1964069838333443&amp;ev=PageView&amp;noscript=1"
      alt=""
    >
  </noscript>


  <!-- MAIN LANDING PAGE -->

  <div class="video-container">

    <a
      id="video-link"
      class="video-link"

      href="https://jayakaya99b.com/RFJK-FB001"

      target="_blank"
      rel="noopener noreferrer"

      aria-label="Open JK99 Registration"
    >

      <video
        id="heroVideo"

        autoplay
        muted
        loop

        playsinline
        webkit-playsinline

        preload="auto"

        disablepictureinpicture
        disableremoteplayback
      >

        <source
          src="poster.mp4"
          type="video/mp4"
        >

        Your browser does not support the video.

      </video>

    </a>

  </div>

  <!-- END LANDING PAGE -->


  <script>

    /* VIDEO AUTOPLAY */

    const video =
      document.getElementById("heroVideo");

    video.muted = true;
    video.defaultMuted = true;

    video.setAttribute("muted", "");
    video.setAttribute("playsinline", "");

    function startVideo() {

      if (!video.paused) return;

      const playPromise = video.play();

      if (
        playPromise &&
        typeof playPromise.catch === "function"
      ) {

        playPromise.catch(error => {
          console.log(
            "Autoplay prevented:",
            error
          );
        });

      }

    }

    if (document.readyState === "loading") {

      document.addEventListener(
        "DOMContentLoaded",
        startVideo
      );

    } else {

      startVideo();

    }

    video.addEventListener(
      "canplay",
      startVideo,
      { once: true }
    );

    document.addEventListener(
      "visibilitychange",
      function() {

        if (!document.hidden && video.paused) {
          startVideo();
        }

      }
    );


    /* META PIXEL LEAD TRACKING */

    const videoLink =
      document.getElementById("video-link");

    videoLink.addEventListener(
      "click",
      function() {

        // Trigger Lead when the video is clicked
        if (typeof fbq === "function") {

          fbq(
            "trackSingle",
            "1964069838333443",
            "Lead",
            {
              content_name: "JK99 Video Click",
              content_category: "Landing Page",
              button_name: "Video Registration Click"
            }
          );

          console.log(
            "Meta Pixel Lead triggered: Video Click"
          );

        }

      }
    );

  </script>

</body>
</html>
